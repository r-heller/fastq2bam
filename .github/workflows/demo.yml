name: Synthetic alignment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      FASTQ2BAM_ALIGNER: rsubread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install alignment system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libbz2-dev liblzma-dev zlib1g-dev hisat2 samtools fastqc poppler-utils
      - name: Dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("BiocManager", "data.table", "ggplot2", "R.utils"))
          BiocManager::install(version="3.23", ask=FALSE)
          packages <- c("ShortRead", "Rsamtools", "GenomicAlignments", "Biostrings", "BiocParallel", "Rsubread")
          BiocManager::install(packages, ask=FALSE, update=FALSE)
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly=TRUE)]
          if (length(missing)) stop("Missing alignment dependencies: ", paste(missing, collapse=", "))
      - run: Rscript --vanilla tests/test_commands.R
      - run: Rscript --vanilla tests/test_demo.R
      - run: Rscript --vanilla tests/test_quality_report.R
      - run: Rscript --vanilla 00_fastq_to_bam_pipeline.R
      - name: Verify native HISAT2, samtools and FastQC paths
        run: |
          hisat2 --version
          hisat2-build --version
          samtools --version
          fastqc --version
          for type in dna rna; do
            FASTQ2BAM_ALIGNER=hisat2 FASTQ2BAM_TYPE="$type" \
              FASTQ2BAM_RUN_DIR="results/hisat2-${type} quoted's run" \
              Rscript --vanilla 00_fastq_to_bam_pipeline.R
          done
      - name: Reject rendered plotting errors
        run: |
          while IFS= read -r -d '' report; do
            pdftotext "$report" report-text.txt
            if grep -E "Error using packet|breaks.*not unique" report-text.txt; then
              echo "Plotting error in $report"
              exit 1
            fi
          done < <(find results -type f -name '*.pdf' -print0)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: synthetic-results
          path: results/
